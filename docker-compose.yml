version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: roombook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roombook
      POSTGRES_PASSWORD: roombook_dev_password
      POSTGRES_DB: roombook_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roombook']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
