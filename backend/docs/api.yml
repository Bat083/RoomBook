openapi: 3.0.3
info:
  title: Room Booking System API
  description: REST API for managing room bookings with authentication, authorization, and notifications
  version: 1.0.0
  contact:
    name: API Support
    email: support@roombooking.example.com

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: https://api.roombooking.example.com/api/v1
    description: Production server

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Rooms
    description: Room management and availability
  - name: Bookings
    description: Booking creation, management, and check-in
  - name: Calendar
    description: Calendar view of bookings
  - name: Notifications
    description: User notifications

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session-based authentication
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF protection token

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        isVIP:
          type: boolean
        rankingScore:
          type: integer
        createdAt:
          type: string
          format: date-time

    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
        isVIP:
          type: boolean
        equipment:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        organizerId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duration in minutes
        purpose:
          type: string
        status:
          type: string
          enum: [CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW]
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        room:
          $ref: '#/components/schemas/Room'
        organizer:
          $ref: '#/components/schemas/User'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/User'

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [BOOKING_CONFIRMED, BOOKING_REJECTED, BOOKING_CANCELLED, NO_SHOW_PENALTY]
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CalendarEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        roomId:
          type: string
          format: uuid
        roomName:
          type: string
        status:
          type: string
        organizerId:
          type: string
          format: uuid
        organizerName:
          type: string

security:
  - sessionAuth: []
    csrfToken: []

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: End user session
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Retrieve authenticated user information
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated

  /rooms:
    get:
      tags:
        - Rooms
      summary: List rooms
      description: Get available rooms with optional filtering
      security: []
      parameters:
        - name: startTime
          in: query
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          schema:
            type: string
            format: date-time
        - name: capacity
          in: query
          schema:
            type: integer
            minimum: 1
        - name: equipment
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'

  /rooms/{id}:
    get:
      tags:
        - Rooms
      summary: Get room by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Room details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Room not found

  /bookings:
    post:
      tags:
        - Bookings
      summary: Create booking
      description: Create a new room booking with conflict detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roomId
                - startTime
                - duration
                - purpose
              properties:
                roomId:
                  type: string
                  format: uuid
                startTime:
                  type: string
                  format: date-time
                duration:
                  type: integer
                  minimum: 15
                  maximum: 480
                purpose:
                  type: string
                  minLength: 1
                  maxLength: 500
                participantIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Validation error
        '403':
          description: Insufficient clearance for VIP room
        '409':
          description: Booking conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  alternatives:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'

    get:
      tags:
        - Bookings
      summary: List user bookings
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW]
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer

  /bookings/{id}:
    get:
      tags:
        - Bookings
      summary: Get booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Booking not found

    delete:
      tags:
        - Bookings
      summary: Cancel booking
      description: Cancel a confirmed booking (organizer only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          description: Not authorized (not organizer)
        '404':
          description: Booking not found

  /bookings/{id}/check-in:
    post:
      tags:
        - Bookings
      summary: Check in to booking
      description: Check in to a confirmed booking within grace period
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Check-in successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid state or outside check-in window
        '404':
          description: Booking not found

  /calendar:
    get:
      tags:
        - Calendar
      summary: Get calendar events
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: roomId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'

  /notifications:
    get:
      tags:
        - Notifications
      summary: Get user notifications
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer

  /notifications/{id}/read:
    put:
      tags:
        - Notifications
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          description: Notification not found
